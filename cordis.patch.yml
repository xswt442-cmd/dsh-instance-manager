# dsh-instance-manager bundle patch: mount the host half as one loader row.
# The package manifest's `dsh.client` declaration makes client-modules serve
# lib/client.js as the browser module for this row automatically (no separate
# dsh.client row needed). The row loads dsh-instance-manager (host half) which
# registers the /dsh-instance-manager/api JSON route on the webserver.
- insert:
    - id: instance-manager
      name: dsh-instance-manager
