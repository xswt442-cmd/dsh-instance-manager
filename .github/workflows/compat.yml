name: compat

on:
  # The gate has to run where a change can still be acted on. With only push and
  # schedule here, the first signal a branch sent was the merge commit turning
  # `main` red, and a pull request could land having never been tested at all —
  # the docs job was the only check a PR saw.
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]

# One run per branch: a burst of commits cancels the superseded runs instead
# of queueing a full boot-check behind each of them.
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor `engines.node` promises, and a promise no job runs is a
        # promise that quietly stops being true. 24 is the line this plugin is
        # developed and released against.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # This repository tracks no lockfile on purpose (.gitignore: pinning
      # devDependency tarballs says nothing about a published library whose runtime
      # is plain Node ESM with zero dependencies). `npm ci` and setup-node's
      # `cache: npm` both take their input from a lockfile, so neither is available
      # here; `--ignore-scripts` is what keeps a registry-side install hook out of
      # this job.
      - name: install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: syntax check every module
        # `files` ships every module in lib/, so the syntax gate covers all of them.
        # Naming index.js and client.js left lib/fleet.js and lib/agent-tools.js —
        # the two that carry the peer link and the tool schemas — unchecked on a
        # push, and a broken one is a plugin that never mounts.
        run: |
          set -e
          for f in lib/*.js; do node --check "$f"; done
      - name: host module imports and exports a plugin
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { if (!m.default || typeof m.default.apply !== 'function') { console.error('missing default plugin'); process.exit(1) } })"
      - name: unit tests
        run: npm test
      - name: package contents
        run: npm pack --dry-run
      - name: manifest consistency
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.dsh.bundle.patch) { Write-Error 'dsh.bundle.patch missing' }
          if ($pkg.dsh.client.platform -ne 'web') { Write-Error 'dsh.client.platform must be web' }
          $client = Get-Content lib/client.js -Raw
          if ($client -notmatch [regex]::Escape("id: '$($pkg.name)'")) { Write-Error 'client bundle id does not match package name' }
          $patch = Get-Content cordis.patch.yml -Raw
          if ($patch -notmatch [regex]::Escape($pkg.name)) { Write-Error 'patch does not mount this package' }
          $shared = Get-Content lib/shared.js -Raw
          if ($shared -notmatch [regex]::Escape("VERSION = '$($pkg.version)'")) { Write-Error 'lib/shared.js VERSION does not match package version' }
          # The dock's placement preference is retired: the launcher's position is
          # a rule inside the launcher fragment, so there is no placement literal to
          # mirror across lib/shared.js and lib/client.js any more.

  # The three shared host fragments are verified by `npm test`, whose http:check /
  # loopback:check / guard:check compare each marked block against the pinned dock
  # version. A check only sees the markers that version knows, so a block newer
  # than the pin passes silently and the marker pair asserted by
  # test/host-http.test.js is what proves it is embedded at all.
  # A cross-repo comparison is not run here: its property cannot hold while a peer
  # checkout resolves to a different branch. `dsh-plugin-parity` (from the dock)
  # stays available as a manual diagnostic for when every checkout shares a branch.
  boot-check:
    name: boot dsh web with bundle (${{ matrix.os }}, dsh${{ matrix.dsh-spec }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Pin the supported 0.1.5 line at its known-bootable rc.3 and test the
        # 0.1.7 settings migration explicitly. Avoid a moving `@latest` here:
        # this job is the reproducible compatibility contract.
        #
        # 0.1.7-rc.2 is the line to keep: the 0.1.7 line renamed the client
        # settings service (settingsScope -> configForms) and moved a plugin's
        # settings into the profile entry's config, so the two halves of this
        # plugin take different code paths there. Both paths are covered by unit
        # tests; this job is what proves the pair works against a real host.
        #
        dsh-spec: ['@0.1.5-rc.3', '@0.1.7-rc.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # dsh prepares a profile's plugins with pnpm and the npm package does not
      # depend on it, so a missing pnpm is a plausible cause of a boot failure.
      # Measured on these runners: pnpm is absent and 0.1.5-rc.3 still boots, so
      # it is not the cause. Record the toolchain anyway — comparisons between
      # runs are only possible when each run states what it ran on.
      - name: report toolchain
        shell: bash
        run: |
          node --version
          npm --version
          pnpm --version 2>/dev/null || echo "pnpm: absent"
          command -v corepack >/dev/null 2>&1 && corepack --version || echo "corepack: absent"
      - name: install dsh
        run: npm i -g "@deepseek-ai/dsh${{ matrix.dsh-spec }}"
      - name: register bundle into a temp profile (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          New-Item -ItemType Directory -Force "$env:DSH_HOME\profiles\web\node_modules" | Out-Null
          $src = (Get-Location).Path
          New-Item -ItemType Junction -Path "$env:DSH_HOME\profiles\web\node_modules\dsh-instance-manager" -Target $src | Out-Null
          $pf = "$env:DSH_HOME\profiles\web\package.json"
          @'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-instance-manager"] } }
          }
          '@ | Set-Content $pf -Encoding UTF8
          # rewrite without BOM (JSON.parse rejects BOM)
          $json = Get-Content $pf -Raw | ConvertFrom-Json
          [System.IO.File]::WriteAllText($pf, ($json | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
      - name: register bundle into a temp profile (linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dshhome
        run: |
          mkdir -p "$DSH_HOME/profiles/web/node_modules"
          ln -s "$GITHUB_WORKSPACE" "$DSH_HOME/profiles/web/node_modules/dsh-instance-manager"
          cat > "$DSH_HOME/profiles/web/package.json" <<'EOF'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-instance-manager"] } }
          }
          EOF
      - name: boot dsh web on 3129 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          # resolve the globally installed dsh CLI binary (the profile does not
          # contain @deepseek-ai/dsh itself on a fresh machine)
          $globalRoot = (& npm root -g).Trim()
          $dshBin = Join-Path $globalRoot "@deepseek-ai\dsh\lib\bin.js"
          if (-not (Test-Path $dshBin)) { Write-Error "dsh bin not found at $dshBin" }
          $launchOut = Join-Path $env:RUNNER_TEMP 'dsh-launch.out.log'
          $launchErr = Join-Path $env:RUNNER_TEMP 'dsh-launch.err.log'
          # The host announces its launch token on that stdout, and the token is a
          # credential for the runner's web server for as long as the process
          # lives. Echoing the raw log on the failure path would publish it into the
          # workflow transcript, which is retained and readable far more widely than
          # the job that produced it. Redact those lines; the auth loop below still
          # reads the token out of the file directly and never echoes it.
          function Show-DshLog([string]$path) {
            if (-not (Test-Path $path)) { Write-Host "<no log at $path>"; return }
            ((Get-Content $path -ErrorAction SilentlyContinue) | ForEach-Object {
              if ($_ -match '[?&]token=' -or $_ -match '(?i)launch[\s_-]?token') { '<line redacted: carried a launch token>' } else { $_ }
            }) -join "`n"
          }
          $p = Start-Process -FilePath (Get-Command node).Source -ArgumentList "`"$dshBin`"", "--profile", "web", "--no-open", "--port", "3129" -RedirectStandardOutput $launchOut -RedirectStandardError $launchErr -WindowStyle Hidden -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:3129/dsh-instance-manager/api?action=self" -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ready = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          if (-not $ready) {
            Show-DshLog $launchOut
            Show-DshLog $launchErr
            Write-Host '--- profile projection: is the entry there? ---'
            Get-ChildItem "$env:DSH_HOME\profiles\node_modules\@deepseek-ai" -ErrorAction SilentlyContinue |
              Select-Object -First 30 Name, LinkType, Target | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '--- global install: is the package reachable at all? ---'
            & npm ls -g --depth=0 2>&1 | Out-String | Write-Host
            & npm ls -g "@deepseek-ai/dsh-sandbox-local" "@deepseek-ai/dsh-base" 2>&1 | Out-String | Write-Host
            Write-Error "dsh web did not become ready"
          }
          $cookieJar = Join-Path $env:RUNNER_TEMP 'dsh-cookies.txt'
          $shellFile = Join-Path $env:RUNNER_TEMP 'dsh-shell.html'
          $shellReady = $false
          $shellCode = '000'
          for ($i = 0; $i -lt 15 -and -not $shellReady; $i++) {
            $launchText = [string](Get-Content $launchOut -Raw -ErrorAction SilentlyContinue) + [string](Get-Content $launchErr -Raw -ErrorAction SilentlyContinue)
            $token = [regex]::Match($launchText, '[?&]token=([^&\s\)]+)').Groups[1].Value
            $launchUrl = 'http://127.0.0.1:3129/'
            if ($token) { $launchUrl += "?token=$token" }
            $shellCode = & curl.exe -sS -L --noproxy '*' -c $cookieJar -b $cookieJar -o $shellFile -w '%{http_code}' $launchUrl
            if ($LASTEXITCODE -eq 0 -and $shellCode -eq '200') { $shellReady = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $shellReady) { Write-Error "failed to authenticate web shell: HTTP $shellCode" }
          $cookieArgs = @('-b', $cookieJar)
          function ApiJson([string]$method, [string]$url) {
            $raw = & curl.exe -s --noproxy '*' -X $method @cookieArgs $url
            return $raw | ConvertFrom-Json
          }
          $api = ApiJson GET "http://127.0.0.1:3129/dsh-instance-manager/api?action=list"
          if ($null -eq $api.items) { Write-Error "manager api returned unexpected payload" }
          # the <=0.4.1 alias was removed in 0.5.0; assert it is really gone so a
          # re-introduction fails the build instead of silently shipping
          $legacy = Invoke-WebRequest -Uri "http://127.0.0.1:3129/dsh-easy-port-manager/api?action=self" -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
          if ($legacy.StatusCode -ne 404) { Write-Error "legacy alias route should be gone, answered $($legacy.StatusCode)" }
          $shellHtml = Get-Content $shellFile -Raw
          $advertised = [regex]::Match($shellHtml, '["''](/?plugins/[^"'']*dsh-instance-manager/client\.js[^"'']*)["'']')
          if (-not $advertised.Success) { Write-Error 'shell did not advertise the client bundle' }
          $bundlePath = [System.Net.WebUtility]::HtmlDecode($advertised.Groups[1].Value)
          if (-not $bundlePath.StartsWith('/')) { $bundlePath = "/$bundlePath" }
          $clientCode = & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' @cookieArgs "http://127.0.0.1:3129$bundlePath"
          if ($clientCode -ne '200') { Write-Error "advertised client bundle not served" }
          # --- request checks (see README 安全模型) ---
          function ApiCode([string]$method, [string]$url, [string[]]$curlArgs = @()) {
            & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' -X $method @cookieArgs @curlArgs $url
          }
          $b = "http://127.0.0.1:3129/dsh-instance-manager/api"
          if ((ApiCode GET "$b`?action=start") -ne '405') { Write-Error 'guard regression: GET start must be 405' }
          if ((ApiCode GET "$b`?action=stop&port=1") -ne '405') { Write-Error 'guard regression: GET stop must be 405' }
          # safe to probe: the 405 is returned before any self-exit is scheduled
          if ((ApiCode GET "$b`?action=stop-self") -ne '405') { Write-Error 'guard regression: GET stop-self must be 405' }
          # stop parses its port with normalizePort, not Number(): '1e3' must
          # be rejected as a bad request, never forwarded to port 1000.
          if ((ApiCode POST "$b`?action=stop&port=1e3") -ne '400') { Write-Error 'guard regression: stop&port=1e3 must be 400' }
          # The three header checks below assert the DEPLOYED request fence, not this plugin's
          # own embedded guard: a host that mounts the Connection service fences with its
          # Host/Origin rule plus the signed browser cookie, and the embedded guard only
          # runs where no Connection service is mounted. Keep them as end-to-end assertions
          # of the boundary a caller actually reaches; the guard itself is covered by the
          # unit tests (and, for the no-Connection route, by the route-level test).

          if ((ApiCode POST "$b`?action=stop-all" @('-H','Origin: https://evil.example')) -ne '403') { Write-Error 'the deployed API must reject a foreign Origin (403)' }
          if ((ApiCode GET "$b`?action=list" @('-H','sec-fetch-site: cross-site')) -ne '403') { Write-Error 'the deployed API must reject a cross-site request (403)' }
          if ((ApiCode GET "$b`?action=list" @('-H','Host: rebound.example')) -ne '403') { Write-Error 'the deployed API must reject a rebound Host (403)' }
          # --- start read-back regression: spawn -> ok+pid -> reachable -> stop ---
          $start = ApiJson POST "$b`?action=start"
          if (-not $start.ok -or -not $start.pid) { Write-Error "start read-back failed: $($start | ConvertTo-Json -Compress)" }
          if ((ApiCode GET "http://127.0.0.1:$($start.port)/dsh-instance-manager/api?action=self") -ne '200') { Write-Error "started instance unreachable on :$($start.port)" }
          # --- sessions summary: self + forwarded to the fresh instance ---
          $selfSess = ApiJson GET "$b`?action=sessions"
          if (-not $selfSess.ok) { Write-Error 'self sessions summary failed' }
          $fwdSess = ApiJson GET "$b`?action=sessions&port=$($start.port)"
          if (-not $fwdSess.ok) { Write-Error "forwarded sessions failed: $($fwdSess | ConvertTo-Json -Compress)" }
          # --- log read: the fresh instance, plus the peer-param rules that
          # --- silently broke every local read in 0.9.0 (peer=undefined) ---
          $log = ApiJson GET "$b`?action=logs&port=$($start.port)"
          if (-not $log.ok) { Write-Error "log read failed: $($log | ConvertTo-Json -Compress)" }
          $sentinel = ApiJson GET "$b`?action=logs&port=$($start.port)&peer=undefined"
          if (-not $sentinel.ok) { Write-Error "peer=undefined must mean no peer: $($sentinel | ConvertTo-Json -Compress)" }
          if ((ApiCode GET "$b`?action=logs&port=$($start.port)&peer=nope") -ne '400') { Write-Error 'unknown peer must be 400, not a local fallback' }
          # --- SSE endpoint answers as an event stream ---
          $evBase = $b -replace '/api$', ''
          $evHeaders = Join-Path $env:RUNNER_TEMP 'dshim-ev-headers.txt'
          & curl.exe -s --noproxy '*' @cookieArgs --max-time 2 -o NUL -D $evHeaders "$evBase/events"
          if ((Get-Content $evHeaders -Raw) -notmatch 'text/event-stream') { Write-Error 'SSE endpoint missing' }
          # --- fleet link fails closed without a token (F1/F2 regression) ---
          $linkCode = & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' --max-time 3 -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw==" "http://127.0.0.1:3129/dsh-instance-manager/link"
          if ($linkCode -ne '403') { Write-Error "fleet link must fail closed without a token (got $linkCode)" }
          $null = ApiJson POST "$b`?action=stop&port=$($start.port)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "compat check passed"
      - name: boot dsh web on 3129 (linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dshhome
        run: |
          globalRoot="$(npm root -g)"
          dshBin="$globalRoot/@deepseek-ai/dsh/lib/bin.js"
          [ -f "$dshBin" ] || { echo "::error::dsh bin not found at $dshBin"; exit 1; }
          launch_log="$RUNNER_TEMP/dsh-launch.log"
          node "$dshBin" --profile web --no-open --port 3129 >"$launch_log" 2>&1 &
          pid=$!
          # The host announces its launch token on that log, and the token is a
          # credential for the runner's web server for as long as the process
          # lives. A raw `cat` on the failure path would publish it into the
          # workflow transcript, which is retained and readable far more widely
          # than the job that produced it. Drop the lines that carry one; the
          # token is still read out of the file below and used, never echoed.
          show_log() {
            [ -f "$1" ] || { echo "<no log at $1>"; return; }
            grep -viE '[?&]token=|launch[ _-]?token' "$1" || true
          }
          cookie_args=()
          code() { curl -s -o /dev/null -w '%{http_code}' --noproxy '*' "${cookie_args[@]}" "$@"; }
          ready=0
          for i in $(seq 60); do
            sleep 1
            [ "$(code 'http://127.0.0.1:3129/dsh-instance-manager/api?action=self')" = "200" ] && { ready=1; break; }
            kill -0 "$pid" 2>/dev/null || break
          done
          if [ "$ready" != "1" ]; then
            echo "::error::dsh web did not become ready"
            show_log "$launch_log" || true
            echo '--- profile projection: is the entry there? ---'
            ls -l "$DSH_HOME/profiles/node_modules/@deepseek-ai" 2>/dev/null | head -30 || true
            echo '--- global install: is the package reachable at all? ---'
            npm ls -g --depth=0 2>&1 | head -20 || true
            npm ls -g @deepseek-ai/dsh-sandbox-local @deepseek-ai/dsh-base 2>&1 | head -20 || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          cookie_jar="$RUNNER_TEMP/dsh-cookies.txt"
          shell_html="$RUNNER_TEMP/dsh-shell.html"
          shell_ready=0
          shell_code=000
          for i in $(seq 15); do
            token=$(sed -n 's/.*[?&]token=\([^&[:space:])]*\).*/\1/p' "$launch_log" | tail -n 1)
            launch_url='http://127.0.0.1:3129/'
            [ -n "$token" ] && launch_url="${launch_url}?token=${token}"
            shell_code=$(curl -sS -L --noproxy '*' -c "$cookie_jar" -b "$cookie_jar" -o "$shell_html" -w '%{http_code}' "$launch_url" || true)
            [ "$shell_code" = 200 ] && { shell_ready=1; break; }
            sleep 1
          done
          [ "$shell_ready" = 1 ] || { echo "::error::failed to authenticate web shell: HTTP $shell_code"; show_log "$launch_log"; kill "$pid" 2>/dev/null || true; exit 1; }
          cookie_args=(-b "$cookie_jar")
          curl -s --noproxy '*' "${cookie_args[@]}" "http://127.0.0.1:3129/dsh-instance-manager/api?action=list" | grep -q '"items"' \
            || { echo "::error::manager api returned unexpected payload"; kill "$pid" 2>/dev/null; exit 1; }
          # the <=0.4.1 alias was removed in 0.5.0; assert it is really gone so a
          # re-introduction fails the build instead of silently shipping
          [ "$(code "http://127.0.0.1:3129/dsh-easy-port-manager/api?action=self")" = "404" ] \
            || { echo "::error::legacy alias route should be gone, did not answer 404"; kill "$pid" 2>/dev/null; exit 1; }
          # 0.1.7 advertises the roster entry as `plugins/??<name>/client.js&rev=…`
          # — no leading slash, and the preload list packs every name into one
          # `??` URL. Excluding the comma from the prefix keeps that combined
          # URL from matching; the per-entry URL is the one that can be fetched.
          bundle_path=$(grep -oE '/?plugins/[^"< ,]*dsh-instance-manager/client\.js[^"< ]*' "$shell_html" | head -n 1 | sed 's/&amp;/\&/g' || true)
          [ -n "$bundle_path" ] || { echo "::error::shell did not advertise client bundle"; kill "$pid" 2>/dev/null; exit 1; }
          case "$bundle_path" in /*) ;; *) bundle_path="/$bundle_path" ;; esac
          [ "$(code "http://127.0.0.1:3129$bundle_path")" = "200" ] || { echo "::error::advertised client bundle not served"; kill "$pid" 2>/dev/null; exit 1; }
          # --- request checks (see README 安全模型) ---
          b="http://127.0.0.1:3129/dsh-instance-manager/api"
          [ "$(code -X GET "$b?action=start")" = "405" ] || { echo "::error::guard regression: GET start must be 405"; exit 1; }
          [ "$(code -X GET "$b?action=stop&port=1")" = "405" ] || { echo "::error::guard regression: GET stop must be 405"; exit 1; }
          # safe to probe: the 405 is returned before any self-exit is scheduled
          [ "$(code -X GET "$b?action=stop-self")" = "405" ] || { echo "::error::guard regression: GET stop-self must be 405"; exit 1; }
          # stop parses its port with normalizePort, not Number(): '1e3' must
          # be rejected as a bad request, never forwarded to port 1000.
          [ "$(code -X POST "$b?action=stop&port=1e3")" = "400" ] || { echo "::error::guard regression: stop&port=1e3 must be 400"; kill "$pid" 2>/dev/null || true; exit 1; }
          # The three header checks below assert the DEPLOYED request fence, not this plugin's
          # own embedded guard: a host that mounts the Connection service fences with its
          # Host/Origin rule plus the signed browser cookie, and the embedded guard only
          # runs where no Connection service is mounted. Keep them as end-to-end assertions
          # of the boundary a caller actually reaches; the guard itself is covered by the
          # unit tests (and, for the no-Connection route, by the route-level test).

          [ "$(code -X POST -H 'Origin: https://evil.example' "$b?action=stop-all")" = "403" ] || { echo "::error::the deployed API must reject a foreign Origin (403)"; exit 1; }
          [ "$(code -H 'sec-fetch-site: cross-site' "$b?action=list")" = "403" ] || { echo "::error::the deployed API must reject a cross-site request (403)"; exit 1; }
          [ "$(code -H 'Host: rebound.example' "$b?action=list")" = "403" ] || { echo "::error::the deployed API must reject a rebound Host (403)"; exit 1; }
          # --- start read-back regression: spawn -> ok+pid -> reachable -> stop ---
          start_json=$(curl -s --noproxy '*' "${cookie_args[@]}" -X POST "$b?action=start" --max-time 60)
          echo "$start_json" | grep -q '"pid"' || { echo "::error::start read-back failed: $start_json"; kill "$pid" 2>/dev/null || true; exit 1; }
          new_port=$(printf '%s' "$start_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).port||''))}catch(e){}})")
          [ -n "$new_port" ] || { echo "::error::start returned no usable port"; kill "$pid" 2>/dev/null || true; exit 1; }
          [ "$(code "http://127.0.0.1:$new_port/dsh-instance-manager/api?action=self")" = "200" ] || { echo "::error::started instance unreachable on :$new_port"; kill "$pid" 2>/dev/null || true; exit 1; }
          # --- sessions summary: self + forwarded to the fresh instance ---
          curl -s --noproxy '*' "${cookie_args[@]}" --max-time 15 "$b?action=sessions" | grep -q '"ok":true' || { echo "::error::self sessions failed"; kill "$pid" 2>/dev/null || true; exit 1; }
          curl -s --noproxy '*' "${cookie_args[@]}" --max-time 20 "$b?action=sessions&port=$new_port" | grep -q '"ok":true' || { echo "::error::forwarded sessions failed"; kill "$pid" 2>/dev/null || true; exit 1; }
          # --- log read: the fresh instance, plus the peer-param rules that
          # --- silently broke every local read in 0.9.0 (peer=undefined) ---
          curl -s --noproxy '*' "${cookie_args[@]}" --max-time 20 "$b?action=logs&port=$new_port" | grep -q '"ok":true' || { echo "::error::log read failed"; kill "$pid" 2>/dev/null || true; exit 1; }
          curl -s --noproxy '*' "${cookie_args[@]}" --max-time 20 "$b?action=logs&port=$new_port&peer=undefined" | grep -q '"ok":true' || { echo "::error::peer=undefined must mean no peer"; kill "$pid" 2>/dev/null || true; exit 1; }
          [ "$(code -X GET "$b?action=logs&port=$new_port&peer=nope")" = "400" ] || { echo "::error::unknown peer must be 400, not a local fallback"; kill "$pid" 2>/dev/null || true; exit 1; }
          # --- SSE endpoint answers as an event stream ---
          ev_root="${b%/api}"
          curl -s --noproxy '*' "${cookie_args[@]}" --max-time 2 -o /dev/null -D /tmp/dshim-ev-h.txt "$ev_root/events" || true
          grep -qi 'text/event-stream' /tmp/dshim-ev-h.txt || { echo "::error::SSE endpoint missing"; kill "$pid" 2>/dev/null || true; exit 1; }
          # --- fleet link fails closed without a token (F1/F2 regression) ---
          link_code=$(curl -s -o /dev/null -w '%{http_code}' --noproxy '*' --max-time 3 -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw==" "http://127.0.0.1:3129/dsh-instance-manager/link")
          [ "$link_code" = "403" ] || { echo "::error::fleet link must fail closed without a token (got $link_code)"; kill "$pid" 2>/dev/null || true; exit 1; }
          curl -s --noproxy '*' "${cookie_args[@]}" -X POST "$b?action=stop&port=$new_port" --max-time 30 > /dev/null
          kill "$pid" 2>/dev/null || true
          echo "compat check passed"
