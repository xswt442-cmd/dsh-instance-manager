name: docs

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  bilingual:
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run docs:check
      - name: require paired edits
        if: env.DOCS_BASE != ''
        run: npm run docs:check -- --base "$DOCS_BASE"

